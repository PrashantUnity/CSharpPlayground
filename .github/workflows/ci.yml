name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CSharpEditorPlugin.slnx

      - name: Build solution
        run: dotnet build CSharpEditorPlugin.slnx -c Release --no-restore

      - name: Run xUnit Tests
        run: dotnet test CSharpEditorPlugin.slnx -c Release --no-build --verbosity normal
